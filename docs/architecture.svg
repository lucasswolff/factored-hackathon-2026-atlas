<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title description">
  <title id="title">Hosted credit advisor architecture</title>
  <desc id="description">Visitors enter through a campaign card or direct visit, select a fictional demo customer, and chat in Spanish or Portuguese. A Lambda Function URL passes requests to a server-owned conversation service. Claude Haiku classifies fresh intent; Claude Sonnet answers many public fact questions. Profile suggestions and simulated prechecks use deterministic local rules. Confirmed mock applications and human-review handoffs are written to DynamoDB and verified by read-back. A protected reviewer page displays stored actions and the handoff conversation thread. The filtered agent roster is a snapshot, not live employee availability.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L9 5 L1 9 Z" fill="#526579"/></marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #183049; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #53677c; }
      .band { font-size: 13px; font-weight: 700; letter-spacing: 1.4px; fill: #526579; }
      .head { font-size: 18px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12.5px; }
      .line { fill: none; stroke: #526579; stroke-width: 2; marker-end: url(#arrow); }
      .soft { fill: #ffffff; stroke: #ccd8e4; stroke-width: 1.5; }
      .blue { fill: #eaf4ff; stroke: #82afe0; stroke-width: 1.5; }
      .green { fill: #eaf8ef; stroke: #81c69b; stroke-width: 1.5; }
      .amber { fill: #fff4de; stroke: #d7b56b; stroke-width: 1.5; }
      .purple { fill: #f2edff; stroke: #ad9ade; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1440" height="1080" fill="#f8fafc"/>
  <text x="48" y="48" class="title">Credit-product advisor: hosted demo</text>
  <text x="48" y="73" class="subtitle">Customer journey, controlled decisions, persistence, and reviewer view</text>

  <text x="48" y="114" class="band">BROWSER EXPERIENCE</text>
  <rect x="48" y="130" width="290" height="126" rx="14" class="blue"/>
  <text x="68" y="160" class="head">1  Entry</text>
  <text x="68" y="187" class="body">Campaign card or direct visit</text>
  <text x="68" y="210" class="body">A new demo conversation starts</text>
  <text x="68" y="233" class="small">Campaign click is a new simulated event</text>

  <rect x="385" y="130" width="290" height="126" rx="14" class="blue"/>
  <text x="405" y="160" class="head">2  Choose a fixture</text>
  <text x="405" y="187" class="body">Fictional P01–P10 customer</text>
  <text x="405" y="210" class="body">Country and ES/PT language</text>
  <text x="405" y="233" class="small">Selection is not authentication</text>

  <rect x="722" y="130" width="290" height="126" rx="14" class="blue"/>
  <text x="742" y="160" class="head">3  Chat</text>
  <text x="742" y="187" class="body">Ask, compare, apply, or seek help</text>
  <text x="742" y="210" class="body">Separate yes/no confirmations</text>
  <text x="742" y="233" class="small">Bot pauses after confirmed handoff</text>

  <rect x="1059" y="130" width="333" height="126" rx="14" class="purple"/>
  <text x="1079" y="160" class="head">Protected reviewer</text>
  <text x="1079" y="187" class="body">Queue data requires code</text>
  <text x="1079" y="210" class="body">Applications + handoff thread</text>
  <text x="1079" y="233" class="small">No employee reply interface</text>

  <path d="M338 193 H381" class="line"/>
  <path d="M675 193 H718" class="line"/>
  <path d="M867 257 V314" class="line"/>
  <path d="M1225 257 V286 H1030 V314" class="line"/>

  <text x="48" y="303" class="band">HOSTED HTTPS SERVICE</text>
  <rect x="180" y="318" width="1080" height="100" rx="16" class="soft"/>
  <text x="205" y="350" class="head">AWS Lambda Function URL → Lambda adapter → Python HTTP service</text>
  <text x="205" y="378" class="body">Reads expiring session from DynamoDB; binds fictional fixture; serves browser API and reviewer API</text>
  <text x="205" y="400" class="small">Conditional session writes reject stale concurrent updates · reviewer API requires separate code</text>

  <text x="48" y="466" class="band">SERVER-OWNED CONVERSATION FLOW</text>
  <rect x="40" y="483" width="320" height="173" rx="14" class="soft"/>
  <text x="60" y="514" class="head">Routing + state</text>
  <text x="60" y="542" class="body">Tracks active card and chat history</text>
  <text x="60" y="566" class="body">Resolves pending yes/no choices</text>
  <text x="60" y="590" class="body">Clarifies ambiguous requests</text>
  <text x="60" y="614" class="body">Offers review for unknown answers</text>
  <text x="60" y="638" class="small">No model-controlled consent or write</text>

  <rect x="386" y="483" width="320" height="173" rx="14" class="soft"/>
  <text x="406" y="514" class="head">Public product answers</text>
  <text x="406" y="542" class="body">Known rules answered in code</text>
  <text x="406" y="566" class="body">Other questions use public facts</text>
  <text x="406" y="590" class="body">Sonnet returns text + fact IDs</text>
  <text x="406" y="614" class="body">Unknown → offer human review</text>
  <text x="406" y="638" class="small">No private profile sent to Claude</text>

  <rect x="732" y="483" width="320" height="173" rx="14" class="green"/>
  <text x="752" y="514" class="head">Profile + precheck</text>
  <text x="752" y="542" class="body">Fixture-bound suggestion rules</text>
  <text x="752" y="566" class="body">Card-specific precheck consent</text>
  <text x="752" y="590" class="body">Deterministic synthetic policy</text>
  <text x="752" y="614" class="body">Explains result, never approves</text>
  <text x="752" y="638" class="small">No self-reported-income suggestion</text>

  <rect x="1078" y="483" width="320" height="173" rx="14" class="amber"/>
  <text x="1098" y="514" class="head">Verified mock actions</text>
  <text x="1098" y="542" class="body">Confirmed application or handoff</text>
  <text x="1098" y="566" class="body">Write once; read back outcome</text>
  <text x="1098" y="590" class="body">Handoff carries bounded thread</text>
  <text x="1098" y="614" class="body">Language → credit → country</text>
  <text x="1098" y="638" class="small">Roster match is a mock assignment</text>

  <path d="M720 418 V450 H200 V479" class="line"/>
  <path d="M720 450 H546 V479" class="line"/>
  <path d="M720 450 H892 V479" class="line"/>
  <path d="M720 450 H1238 V479" class="line"/>

  <text x="48" y="704" class="band">DATA AND EXTERNAL DEPENDENCIES</text>
  <rect x="40" y="722" width="250" height="134" rx="14" class="soft"/>
  <text x="58" y="750" class="head">Versioned public facts</text>
  <text x="58" y="778" class="body">Four demo card offers</text>
  <text x="58" y="801" class="body">Fees, benefits, limits</text>
  <text x="58" y="827" class="small">Team-created; country-specific</text>

  <rect x="318" y="722" width="250" height="134" rx="14" class="purple"/>
  <text x="336" y="750" class="head">Claude API</text>
  <text x="336" y="778" class="body">Haiku: bounded intent choice</text>
  <text x="336" y="801" class="body">Sonnet: public fact answers</text>
  <text x="336" y="827" class="small">Safe fallback; 400 attempts/day</text>

  <rect x="596" y="722" width="250" height="134" rx="14" class="green"/>
  <text x="614" y="750" class="head">Fictional fixtures</text>
  <text x="614" y="778" class="body">Ten team-written profiles</text>
  <text x="614" y="801" class="body">Offer + policy versions</text>
  <text x="614" y="827" class="small">No organizer customer rows hosted</text>

  <rect x="874" y="722" width="250" height="134" rx="14" class="amber"/>
  <text x="892" y="750" class="head">DynamoDB</text>
  <text x="892" y="778" class="body">Sessions + daily counter</text>
  <text x="892" y="801" class="body">Applications + handoffs</text>
  <text x="892" y="827" class="small">Pending actions in reviewer queue</text>

  <rect x="1152" y="722" width="250" height="134" rx="14" class="amber"/>
  <text x="1170" y="750" class="head">Agent roster snapshot</text>
  <text x="1170" y="778" class="body">Active Digital / Hybrid</text>
  <text x="1170" y="801" class="body">Credit + language match</text>
  <text x="1170" y="827" class="small">No live availability signal</text>

  <path d="M501 657 V688 H165 V718" class="line"/>
  <path d="M546 657 V718" class="line"/>
  <path d="M892 657 V688 H721 V718" class="line"/>
  <path d="M1238 657 V688 H999 V718" class="line"/>
  <path d="M1277 657 V718" class="line"/>

  <rect x="40" y="900" width="1360" height="126" rx="14" fill="#e9eef4" stroke="#ccd8e4" stroke-width="1.5"/>
  <text x="60" y="931" class="head">Deployment and operations</text>
  <text x="60" y="959" class="body">Protected main → GitHub Actions tests + Lambda ZIP deploy → code-hash and /healthz checks</text>
  <text x="60" y="984" class="body">AWS Systems Manager holds provider/reviewer secrets; CloudWatch records sanitized request metrics and alarms</text>
  <text x="60" y="1009" class="small">Hosted actions are simulated and PENDING_REVIEW. No bank write, credit approval, employee contact, or live employee chat.</text>
  <text x="48" y="1062" class="small">Public judge build · AWS us-east-2 · source: advisor/, infra/aws/, and the versioned demo fact sheet</text>
</svg>
